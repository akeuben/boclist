name: Fill missing song links

on:
  push:
    branches: [main]
    paths:
      - "src/data/**/*.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fill-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fill-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install yt-search

      - name: Run link-filling script
        run: node scripts/fill-links.mjs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fill missing song links"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "src/data/**/*.json"